
[tool.poetry]
name = "tieteellinen-laskin"
version = "0.1.0"
description = "Tieteellinen laskin Pythonilla"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
coverage = ">=7,<9"

[tool.coverage.run]
branch = true
source = ["calculator"]

[tool.coverage.report]
show_missing = true
